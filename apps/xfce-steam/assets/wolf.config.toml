[[apps]]
title = "Desktop (xfce) + Steam"
icon_png_path = "https://games-on-whales.github.io/wildlife/apps/xfce-steam/assets/icon.png"

[apps.runner]
type = "docker"
name = "WolfXFCESteam"
image = "gow/xfce-steam:latest"
mounts = ["/etc/wolf/profile-data/user/WolfSteam/.steam/steam/steamapps:/home/retro/.steam/steam/steamapps:rw"]
env = ["GOW_REQUIRED_DEVICES=/dev/input/* /dev/dri/* /dev/nvidia* /dev/fuse"]
devices = []
ports = []
base_create_json = """
{
  "HostConfig": {
    "IpcMode": "host",
    "Privileged": false,
    "CapAdd": ["SYS_ADMIN", "SYS_NICE", "SYS_PTRACE", "NET_RAW", "MKNOD", "NET_ADMIN"],
    "SecurityOpt": ["seccomp=unconfined", "apparmor=unconfined"],
    "Ulimits": [{"Name":"nofile", "Hard":10240, "Soft":10240}],
    "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw", "c 10:229 rmw"],
    "Devices": [{"PathOnHost": "/dev/fuse", "PathInContainer": "/dev/fuse", "CgroupPermissions": "rwm"}]
  }
}
\
"""
